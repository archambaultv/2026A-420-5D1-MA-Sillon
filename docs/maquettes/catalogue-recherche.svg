<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fleche" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="960" height="620" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="bold" fill="#111827">Maquette — Catalogue, recherche pendant la frappe</text>

  <!-- Fenêtre de l'application -->
  <rect x="20" y="50" width="640" height="550" fill="#f9fafb" stroke="#9ca3af" stroke-width="2" rx="8"/>
  <rect x="20" y="50" width="640" height="36" fill="#e5e7eb" stroke="#9ca3af" rx="8"/>
  <circle cx="44" cy="68" r="6" fill="#9ca3af"/>
  <circle cx="64" cy="68" r="6" fill="#9ca3af"/>
  <circle cx="84" cy="68" r="6" fill="#9ca3af"/>
  <text x="290" y="73" font-size="14" font-weight="bold" fill="#374151">Sillon</text>

  <!-- Barre latérale -->
  <rect x="20" y="86" width="150" height="514" fill="#eef2f7" stroke="#d1d5db"/>
  <text x="40" y="120" font-size="14" font-weight="bold" fill="#2563eb">Catalogue</text>
  <text x="40" y="150" font-size="14" fill="#4b5563">Prêts</text>
  <text x="40" y="180" font-size="14" fill="#4b5563">Import</text>
  <text x="40" y="210" font-size="14" fill="#4b5563">Statistiques</text>
  <text x="40" y="240" font-size="14" fill="#4b5563">À vendre</text>

  <!-- Champ de recherche -->
  <rect x="190" y="104" width="330" height="40" fill="#ffffff" stroke="#2563eb" stroke-width="2" rx="4"/>
  <text x="204" y="130" font-size="15" fill="#111827">bjork▌</text>
  <rect x="532" y="104" width="108" height="40" fill="#2563eb" rx="4"/>
  <text x="550" y="130" font-size="14" font-weight="bold" fill="#ffffff">+ Disque</text>

  <!-- Compteur de résultats -->
  <text x="190" y="172" font-size="13" fill="#6b7280">3 disques sur 412</text>

  <!-- Résultats -->
  <rect x="190" y="184" width="450" height="52" fill="#ffffff" stroke="#d1d5db"/>
  <text x="206" y="206" font-size="14" font-weight="bold" fill="#111827">Björk — Debut</text>
  <text x="206" y="226" font-size="12" fill="#6b7280">1993 · One Little Indian · très bon · tablette B2</text>

  <rect x="190" y="240" width="450" height="52" fill="#ffffff" stroke="#d1d5db"/>
  <text x="206" y="262" font-size="14" font-weight="bold" fill="#111827">Björk — Post</text>
  <text x="206" y="282" font-size="12" fill="#6b7280">1995 · One Little Indian · bon · tablette B2</text>

  <rect x="190" y="296" width="450" height="52" fill="#ffffff" stroke="#d1d5db"/>
  <text x="206" y="318" font-size="14" font-weight="bold" fill="#111827">Björk — Homogenic</text>
  <text x="206" y="338" font-size="12" fill="#6b7280">1997 · One Little Indian · neuf · tablette B3 · <tspan fill="#b45309">prêté à Chan</tspan></text>

  <!-- État aucun résultat -->
  <rect x="190" y="392" width="450" height="70" fill="#fffbeb" stroke="#d97706" stroke-dasharray="5,4" rx="4"/>
  <text x="206" y="418" font-size="13" font-weight="bold" fill="#92400e">État « aucun résultat » :</text>
  <text x="206" y="440" font-size="13" fill="#92400e">« Aucun disque ne correspond à “zappa frank”. »</text>

  <!-- Annotations -->
  <g fill="#d97706" font-size="13">
    <line x1="700" y1="124" x2="644" y2="124" stroke="#d97706" stroke-width="1.5" marker-end="url(#fleche)"/>
    <text x="706" y="112">Les résultats se rafraîchissent</text>
    <text x="706" y="130">pendant la frappe, sans bouton;</text>
    <text x="706" y="148">« bjork » trouve « Björk »</text>
    <text x="706" y="166">(casse et accents ignorés)</text>

    <line x1="700" y1="210" x2="644" y2="210" stroke="#d97706" stroke-width="1.5" marker-end="url(#fleche)"/>
    <text x="706" y="204">Recherche sur l'artiste ET le</text>
    <text x="706" y="222">titre; moins d'une demi-seconde</text>
    <text x="706" y="240">sur 1 000 disques</text>

    <line x1="700" y1="330" x2="644" y2="330" stroke="#d97706" stroke-width="1.5" marker-end="url(#fleche)"/>
    <text x="706" y="318">Un disque prêté l'affiche</text>
    <text x="706" y="336">directement dans la liste</text>

    <line x1="700" y1="427" x2="644" y2="427" stroke="#d97706" stroke-width="1.5" marker-end="url(#fleche)"/>
    <text x="706" y="415">Quand rien ne correspond, un</text>
    <text x="706" y="433">message explicite remplace la</text>
    <text x="706" y="451">liste vide (dessiné ici en encart)</text>
  </g>
</svg>
